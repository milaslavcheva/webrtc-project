<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ghost Chasing</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- QR SCREEN -->
    <div id="qr">
        <div class="qr-container">
            <h1>Ghost Chasing</h1>
            <div id="qrCode"></div>
            <p>Scan the QR code to start the game</p>
        </div>
    </div>

    <!-- GAME -->
    <canvas id="gameCanvas"></canvas>

    <!-- Images -->
    <img id="scaredPerson" src="images/scared_person.png">
    <img id="ghost" src="images/ghost.png">
    <img id="coin" src="images/coin.png" style="display:none;">
    <!-- Shelters -->
    <img id="shelter1" src="images/shelter.png">
    <img id="shelter2" src="images/shelter.png">

    <!-- Coin Counter -->
    <div id="coinCounter">
        <span id="coinNumber">0</span>
        <img src="images/coin.png">
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script type="module" src="/desktop.js"></script>
</body>

</html>
