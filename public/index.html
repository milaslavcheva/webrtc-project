<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Desktop Ghost</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }

        #ghost {
            position: absolute;
            width: 50px;
            height: 50px;
            pointer-events: none;
        }

        #trailCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <canvas id="trailCanvas"></canvas>
    <img id="ghost" src="ghost.png" alt="Ghost">
    <script src="/desktop.js"></script>
</body>

</html>
