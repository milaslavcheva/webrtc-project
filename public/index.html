<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Desktop Ghost</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }

        #trailCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        #scaredPerson,
        #ghost {
            position: absolute;
            width: 50px;
            height: 50px;
            pointer-events: none;
        }

        #qrContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            z-index: 10;
        }
    </style>
</head>

<body>
    <canvas id="trailCanvas"></canvas>
    <img id="scaredPerson" src="scared_person.png" alt="Scared Person">
    <img id="ghost" src="ghost.png" alt="Ghost">

    <div id="qrContainer">
        <h3>Scan to Join</h3>
        <div id="qr"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script src="desktop.js"></script>
</body>

</html>
